<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Stat Clash — Top Trumps &times; Uno</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="app">
      <header>
        <h1>Stat Clash</h1>
        <div id="room-info"></div>
      </header>

      <!-- Lobby -->
      <section id="lobby" class="screen">
        <h2>Play Stat Clash online</h2>
        <p class="sub">Every card has 4 stats. Lead with a card &amp; a stat — everyone answers. The lowest stat loses and collects the pile. First to empty their hand wins.</p>
        <div class="lobby-layout">
          <div class="lobby-list-panel">
            <h3>Open lobbies</h3>
            <ul id="lobby-list" class="lobby-list"></ul>
            <p id="lobby-empty" class="muted">No lobbies open yet. Create one!</p>
          </div>
          <div class="lobby-create-panel">
            <form id="join-form">
              <label>Your name
                <input id="name-input" type="text" maxlength="16" placeholder="Player 1" required />
              </label>
              <button type="submit" id="create-btn" class="primary">Create lobby</button>
              <p id="lobby-error" class="error" hidden></p>
            </form>
          </div>
        </div>
      </section>

      <!-- Waiting room -->
      <section id="waiting" class="screen" hidden>
        <h2>Waiting room</h2>
        <p class="muted">Invite friends:</p>
        <div class="invite-row">
          <code id="invite-url"></code>
          <button id="copy-btn">Copy link</button>
        </div>
        <div id="settings" class="settings" hidden>
          <h3>Host settings</h3>
          <div class="setting-row">
            <label>Starting cards
              <input id="hand-size" type="number" min="5" max="9" value="7" />
            </label>
            <label>Max players
              <input id="max-players" type="number" min="2" max="8" value="6" />
            </label>
            <button id="add-bot-btn">Add bot</button>
            <button id="apply-settings-btn" class="primary">Apply</button>
          </div>
          <p class="muted" id="settings-note"></p>
        </div>
        <ul id="roster" class="roster"></ul>
        <button id="start-btn" class="primary" disabled>Start game</button>
        <p id="waiting-error" class="error" hidden></p>
      </section>

      <!-- Game -->
      <section id="game" class="screen" hidden>
        <div id="opponents" class="opponents"></div>
        <div id="table" class="table"></div>
        <div id="status" class="status"></div>
        <div id="log" class="log"></div>
        <div id="hand" class="hand"></div>
        <div id="controls" class="controls" hidden></div>
        <div id="result-banner" hidden></div>
        <div id="pot-target" hidden></div>
      </section>

      <!-- Win overlay -->
      <div id="winner-overlay" hidden>
        <div class="card">
          <h2 id="winner-title" class="winner-title"></h2>
          <p id="winner-text"></p>
          <button id="new-game-btn" class="primary">Back to lobby</button>
        </div>
      </div>
    </div>

    <script src="app.js"></script>
  </body>
</html>
